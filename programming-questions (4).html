<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gotham Code Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --bg2: #111118;
    --gold: #FFD700;
    --gold2: #FFA500;
    --dark-gold: #8B6914;
    --bat-gray: #1a1a2e;
    --card-bg: rgba(255,215,0,0.04);
    --border: rgba(255,215,0,0.18);
    --text: #e8e8e8;
    --dim: rgba(255,255,255,0.45);
    --red: #cc2200;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Batman logo SVG bg */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,215,0,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,215,0,.03) 1px, transparent 1px);
    background-size: 44px 44px;
    pointer-events: none;
    z-index: 0;
  }

  /* Bat signal orb */
  .bat-orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(140px);
    pointer-events: none;
    z-index: 0;
    opacity: 0.12;
  }
  .bat-orb-1 { width: 700px; height: 700px; background: #FFD700; top: -200px; left: -200px; }
  .bat-orb-2 { width: 500px; height: 500px; background: #FFA500; bottom: -150px; right: -150px; }

  /* Progress bar */
  #progress { position: fixed; top: 0; left: 0; height: 3px; width: 0%; background: linear-gradient(90deg, var(--gold), var(--red)); z-index: 999; transition: width 0.1s; }

  /* HEADER */
  header {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 60px 24px 40px;
  }

  /* Batman SVG logo */
  .bat-logo {
    display: block;
    margin: 0 auto 20px;
    width: 120px;
    filter: drop-shadow(0 0 24px rgba(255,215,0,0.6));
    animation: batPulse 3s ease-in-out infinite;
  }
  @keyframes batPulse {
    0%,100% { filter: drop-shadow(0 0 20px rgba(255,215,0,0.5)); transform: scale(1); }
    50%      { filter: drop-shadow(0 0 40px rgba(255,215,0,0.9)); transform: scale(1.04); }
  }

  .badge {
    display: inline-block;
    background: linear-gradient(135deg, var(--gold), var(--gold2));
    color: #000;
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    padding: 6px 20px;
    border-radius: 999px;
    margin-bottom: 18px;
    font-weight: 700;
  }

  h1 {
    font-family: 'Oswald', sans-serif;
    font-size: clamp(2.4rem, 7vw, 5rem);
    font-weight: 700;
    line-height: 1;
    letter-spacing: 2px;
    background: linear-gradient(135deg, #FFD700 0%, #FFF8DC 40%, #FFA500 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-transform: uppercase;
  }

  .subtitle {
    margin-top: 12px;
    font-size: 0.78rem;
    color: rgba(255,215,0,0.45);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* TABS */
  .section-tabs {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin: 36px 24px 0;
    position: relative;
    z-index: 10;
    flex-wrap: wrap;
  }
  .section-tab {
    background: rgba(255,215,0,0.06);
    border: 1px solid var(--border);
    color: rgba(255,215,0,0.6);
    padding: 10px 28px;
    border-radius: 4px;
    font-family: 'Oswald', sans-serif;
    font-size: 14px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.25s;
    text-transform: uppercase;
  }
  .section-tab:hover, .section-tab.active {
    background: linear-gradient(135deg, var(--gold), var(--gold2));
    border-color: transparent;
    color: #000;
    box-shadow: 0 6px 24px rgba(255,215,0,0.3);
  }

  /* SEARCH */
  .search-wrap {
    position: relative;
    z-index: 10;
    max-width: 520px;
    margin: 24px auto 0;
    padding: 0 24px;
  }
  .search-wrap input {
    width: 100%;
    background: rgba(255,215,0,0.04);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 13px 18px;
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    color: var(--gold);
    outline: none;
    transition: border 0.3s;
  }
  .search-wrap input::placeholder { color: rgba(255,215,0,0.25); }
  .search-wrap input:focus { border-color: var(--gold); background: rgba(255,215,0,0.07); }

  /* FILTERS */
  .filters {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    margin: 20px 24px 0;
    position: relative;
    z-index: 10;
  }
  .filter-btn {
    background: rgba(255,215,0,0.05);
    border: 1px solid rgba(255,215,0,0.2);
    color: rgba(255,215,0,0.55);
    padding: 6px 16px;
    border-radius: 4px;
    font-family: 'Oswald', sans-serif;
    font-size: 12px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
  }
  .filter-btn:hover, .filter-btn.active {
    background: var(--gold);
    border-color: var(--gold);
    color: #000;
    box-shadow: 0 4px 16px rgba(255,215,0,0.25);
  }

  /* STATS */
  .stats {
    display: flex;
    justify-content: center;
    gap: 48px;
    flex-wrap: wrap;
    padding: 28px 24px 20px;
    position: relative;
    z-index: 10;
  }
  .stat { text-align: center; }
  .stat-num {
    font-family: 'Oswald', sans-serif;
    font-size: 2.2rem;
    font-weight: 700;
    background: linear-gradient(135deg, var(--gold), var(--gold2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .stat-label { font-size: 10px; letter-spacing: 2px; color: rgba(255,215,0,0.35); text-transform: uppercase; margin-top: 4px; }

  /* SECTION HEADING */
  .section-heading {
    position: relative;
    z-index: 10;
    max-width: 1300px;
    margin: 32px auto 16px;
    padding: 0 24px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .section-heading h2 {
    font-family: 'Oswald', sans-serif;
    font-size: 1.4rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    background: linear-gradient(90deg, var(--gold), var(--gold2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .section-heading::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, rgba(255,215,0,0.3), transparent);
  }

  /* GRID */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 20px;
    max-width: 1300px;
    margin: 0 auto;
    padding: 0 24px 60px;
    position: relative;
    z-index: 10;
  }

  /* CARD */
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 22px;
    transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 3px;
    height: 100%;
    background: linear-gradient(180deg, var(--gold), var(--gold2));
    opacity: 0;
    transition: opacity 0.3s;
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: rgba(255,215,0,0.4);
    box-shadow: 0 12px 40px rgba(255,215,0,0.12);
  }
  .card:hover::before { opacity: 1; }

  .card-header {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 12px;
  }
  .q-num {
    min-width: 36px;
    height: 36px;
    background: linear-gradient(135deg, var(--gold), var(--gold2));
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: #000;
    flex-shrink: 0;
  }
  .q-title {
    font-family: 'Oswald', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.3;
    padding-top: 6px;
    letter-spacing: 1px;
    color: #fff;
    text-transform: uppercase;
  }
  .q-cat {
    display: inline-block;
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gold);
    border: 1px solid rgba(255,215,0,0.25);
    border-radius: 3px;
    padding: 2px 10px;
    margin-bottom: 10px;
  }
  .q-desc {
    font-size: 0.82rem;
    color: var(--dim);
    line-height: 1.7;
    margin-bottom: 14px;
  }

  /* PATTERN CARD special */
  .card.pattern-card .q-num {
    background: linear-gradient(135deg, var(--red), #880000);
    color: #fff;
  }
  .card.pattern-card { border-color: rgba(204,34,0,0.25); }
  .card.pattern-card:hover { border-color: rgba(204,34,0,0.5); box-shadow: 0 12px 40px rgba(204,34,0,0.12); }
  .card.pattern-card::before { background: linear-gradient(180deg, var(--red), #880000); }
  .card.pattern-card .q-cat { color: var(--red); border-color: rgba(204,34,0,0.3); }

  /* EXPAND BUTTON */
  .expand-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255,215,0,0.07);
    border: 1px solid rgba(255,215,0,0.22);
    color: rgba(255,215,0,0.75);
    font-family: 'Oswald', sans-serif;
    font-size: 12px;
    letter-spacing: 1.5px;
    padding: 9px 14px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
    width: 100%;
    text-transform: uppercase;
  }
  .expand-btn:hover { background: rgba(255,215,0,0.16); border-color: var(--gold); color: var(--gold); }
  .card.pattern-card .expand-btn { background: rgba(204,34,0,0.08); border-color: rgba(204,34,0,0.25); color: rgba(255,100,80,0.8); }
  .card.pattern-card .expand-btn:hover { background: rgba(204,34,0,0.18); border-color: var(--red); color: #ff6040; }
  .expand-btn .arrow { transition: transform 0.3s; display: inline-block; }
  .expand-panel { display: none; margin-top: 12px; }
  .expand-panel.open { display: block; }

  .section-label { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 6px; margin-top: 14px; }
  .section-label.eg-label { color: var(--gold2); }
  .section-label.code-label { color: #6ee7b7; }
  .section-label.pat-label { color: var(--red); }

  .examples-wrap { display: flex; flex-direction: column; gap: 7px; }
  .example-box {
    background: rgba(255,215,0,0.06);
    border: 1px solid rgba(255,215,0,0.15);
    border-radius: 4px;
    padding: 9px 12px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: #FFD700;
    line-height: 1.7;
  }
  .example-box .eg-num { font-size: 8px; letter-spacing: 2px; color: rgba(255,215,0,0.4); display: block; margin-bottom: 3px; text-transform: uppercase; }

  /* Pattern display box */
  .pattern-display {
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(204,34,0,0.25);
    border-radius: 4px;
    padding: 14px 16px;
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    line-height: 1.85;
    color: #ff9966;
    white-space: pre;
    overflow-x: auto;
    letter-spacing: 2px;
  }

  .code-box {
    background: rgba(0,0,0,0.55);
    border: 1px solid rgba(255,215,0,0.12);
    border-radius: 6px;
    padding: 15px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    line-height: 1.9;
    color: #a5f3fc;
    overflow-x: auto;
    white-space: pre;
  }
  .card.pattern-card .code-box { border-color: rgba(204,34,0,0.15); }
  .kw  { color: #FFD700; }
  .fn  { color: #6ee7b7; }
  .cm  { color: #555; font-style: italic; }
  .num { color: #ff9966; }
  .str { color: #86efac; }

  .no-results { text-align: center; padding: 80px 24px; color: rgba(255,215,0,0.25); font-size: 1rem; grid-column: 1/-1; font-family: 'Oswald', sans-serif; letter-spacing: 3px; text-transform: uppercase; }

  footer {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 28px;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255,215,0,0.2);
    border-top: 1px solid rgba(255,215,0,0.1);
  }

  @media (max-width: 768px) { .grid { grid-template-columns: 1fr; padding: 0 14px 60px; } h1 { letter-spacing: 1px; } }
</style>
</head>
<body>
<div id="progress"></div>
<div class="bat-orb bat-orb-1"></div>
<div class="bat-orb bat-orb-2"></div>

<header>
  <!-- Batman SVG Logo -->
  <svg class="bat-logo" viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
    <path fill="#FFD700" d="M100,15 C85,15 75,25 65,30 C50,37 30,32 10,40 C25,42 35,50 38,60 C42,50 50,45 58,48 C52,55 50,65 55,72 C60,62 68,57 75,60 C70,68 70,78 75,85 C80,75 88,70 95,72 C92,80 93,88 100,92 C107,88 108,80 105,72 C112,70 120,75 125,85 C130,78 130,68 125,60 C132,57 140,62 145,72 C150,65 148,55 142,48 C150,45 158,50 162,60 C165,50 175,42 190,40 C170,32 150,37 135,30 C125,25 115,15 100,15Z"/>
  </svg>
  <div class="badge">&#9733; Gotham Code Academy &#9733;</div>
  <h1>Python Mastery<br>Questions + Patterns</h1>
  <p class="subtitle">No built-ins &bull; Manual logic &bull; 2-3 examples each &bull; All patterns coded</p>
</header>

<div class="section-tabs">
  <button class="section-tab active" id="tab-all"    onclick="switchSection('all')">All</button>
  <button class="section-tab"        id="tab-prog"   onclick="switchSection('prog')">&#128196; 37 Questions</button>
  <button class="section-tab"        id="tab-pat"    onclick="switchSection('pat')">&#9733; Patterns</button>
</div>

<div class="search-wrap">
  <input type="text" id="searchInput" placeholder="&#128269;  Search..." />
</div>

<div class="filters" id="filters">
  <button class="filter-btn active" data-cat="all">All</button>
  <button class="filter-btn" data-cat="Numbers">Numbers</button>
  <button class="filter-btn" data-cat="Strings">Strings</button>
  <button class="filter-btn" data-cat="Lists">Lists</button>
  <button class="filter-btn" data-cat="Sorting">Sorting</button>
  <button class="filter-btn" data-cat="Series">Series</button>
  <button class="filter-btn" data-cat="OOP">OOP</button>
  <button class="filter-btn" data-cat="Pattern1">Pat-1</button>
  <button class="filter-btn" data-cat="Pattern2">Pat-2</button>
  <button class="filter-btn" data-cat="Pattern3">Pat-3</button>
</div>

<div class="stats">
  <div class="stat"><div class="stat-num" id="visibleCount">91</div><div class="stat-label">Total</div></div>
  <div class="stat"><div class="stat-num">37</div><div class="stat-label">Questions</div></div>
  <div class="stat"><div class="stat-num">54</div><div class="stat-label">Patterns</div></div>
</div>

<div class="grid" id="grid"></div>
<footer>&#9733; Gotham Code Academy &mdash; Dark Knight approved &mdash; All 91 programs explained &#9733;</footer>

<script>
/* ============================================================
   DATA
============================================================ */
var questions = [
  { num:1, cat:"Numbers", title:"Print 1 to N", isPattern:false,
    desc:"Print all numbers from 1 to N using a loop. Use a counter variable that increments by 1 each time.",
    examples:["Input: N=5\nOutput: 1 2 3 4 5","Input: N=3\nOutput: 1 2 3","Input: N=8\nOutput: 1 2 3 4 5 6 7 8"],
    code:'n = 5\ni = 1\n<span class="kw">while</span> i <= n:\n    <span class="fn">print</span>(i, end=<span class="str">" "</span>)\n    i = i + <span class="num">1</span>'
  },
  { num:2, cat:"Numbers", title:"Armstrong Number", isPattern:false,
    desc:"A number is Armstrong if the sum of each digit raised to the power of total digit count equals the number.",
    examples:["Input: 153\n1^3+5^3+3^3=153  YES","Input: 9474\n9^4+4^4+7^4+4^4=9474  YES","Input: 100\n1+0+0=1 ≠ 100  NO"],
    code:'n = 153\ntemp = n; count = 0\n<span class="kw">while</span> temp != 0:\n    temp = temp // 10\n    count = count + 1\ntemp = n; total = 0\n<span class="kw">while</span> temp != 0:\n    d = temp % 10\n    p = 1; k = 0\n    <span class="kw">while</span> k < count: p *= d; k+=1\n    total += p; temp //= 10\n<span class="fn">print</span>("Armstrong" <span class="kw">if</span> total==n <span class="kw">else</span> "Not")'
  },
  { num:3, cat:"Series", title:"Fibonacci Check", isPattern:false,
    desc:"Check if a number is in the Fibonacci sequence by generating terms one by one until we reach or exceed the target.",
    examples:["Input: 8 -> Fibonacci YES","Input: 13 -> Fibonacci YES","Input: 7 -> Not Fibonacci NO"],
    code:'n = 8; a = 0; b = 1; found = <span class="kw">False</span>\n<span class="kw">while</span> a <= n:\n    <span class="kw">if</span> a == n: found = <span class="kw">True</span>; <span class="kw">break</span>\n    c = a + b; a = b; b = c\n<span class="fn">print</span>("Fibonacci" <span class="kw">if</span> found <span class="kw">else</span> "Not Fibonacci")'
  },
  { num:4, cat:"Numbers", title:"Factorial", isPattern:false,
    desc:"Factorial of N (N!) is the product of all integers from 1 to N. Multiply using a loop.",
    examples:["Input: 5 -> 5x4x3x2x1 = 120","Input: 6 -> 720","Input: 0 -> 1 (by definition)"],
    code:'n = 5; result = 1; i = 1\n<span class="kw">while</span> i <= n:\n    result = result * i\n    i = i + 1\n<span class="fn">print</span>("Factorial:", result)  <span class="cm"># 120</span>'
  },
  { num:5, cat:"Numbers", title:"Strong Number", isPattern:false,
    desc:"A Strong number equals the sum of factorials of its digits. Extract each digit, compute its factorial manually.",
    examples:["Input: 145\n1!+4!+5!=145  YES","Input: 40585 -> YES","Input: 123 -> 1+2+6=9 ≠ 123  NO"],
    code:'n = 145; temp = n; total = 0\n<span class="kw">while</span> temp != 0:\n    d = temp % 10\n    fact = 1; k = 1\n    <span class="kw">while</span> k <= d: fact *= k; k+=1\n    total += fact; temp //= 10\n<span class="fn">print</span>("Strong" <span class="kw">if</span> total==n <span class="kw">else</span> "Not")'
  },
  { num:6, cat:"Numbers", title:"Perfect Number", isPattern:false,
    desc:"A Perfect number equals the sum of all its divisors excluding itself.",
    examples:["Input: 6 -> 1+2+3=6  YES","Input: 28 -> 1+2+4+7+14=28  YES","Input: 12 -> 1+2+3+4+6=16 ≠ 12  NO"],
    code:'n = 6; i = 1; total = 0\n<span class="kw">while</span> i < n:\n    <span class="kw">if</span> n % i == 0: total += i\n    i += 1\n<span class="fn">print</span>("Perfect" <span class="kw">if</span> total==n <span class="kw">else</span> "Not Perfect")'
  },
  { num:7, cat:"Numbers", title:"Reverse Positive Divisors", isPattern:false,
    desc:"Find all divisors (excluding itself), store in a list, then print in reverse order using index traversal.",
    examples:["Input: 12 -> [6,4,3,2,1]","Input: 10 -> [5,2,1]","Input: 16 -> [8,4,2,1]"],
    code:'n = 12; divs = []; i = 1\n<span class="kw">while</span> i < n:\n    <span class="kw">if</span> n % i == 0: divs.append(i)\n    i += 1\nj = len(divs)-1\n<span class="kw">while</span> j >= 0:\n    <span class="fn">print</span>(divs[j], end=" "); j -= 1'
  },
  { num:8, cat:"Numbers", title:"Digit Frequency", isPattern:false,
    desc:"Count how many times each digit appears in a number using a frequency array of size 10.",
    examples:["Input: 11223\n1->2  2->2  3->1","Input: 99821\n9->2  8->1  2->1  1->1","Input: 40040\n4->2  0->3"],
    code:'n = 11223; freq = [0]*10; temp = n\n<span class="kw">while</span> temp != 0:\n    d = temp % 10\n    freq[d] += 1; temp //= 10\ni = 0\n<span class="kw">while</span> i < 10:\n    <span class="kw">if</span> freq[i] > 0: <span class="fn">print</span>(i,"->",freq[i])\n    i += 1'
  },
  { num:9, cat:"Lists", title:"Missing Numbers in List", isPattern:false,

/* ============================================================
   STATE
============================================================ */
var currentSection = 'all';
var currentCat = 'all';
var searchTerm = '';

/* ============================================================
   SECTION SWITCH
============================================================ */
function switchSection(sec) {
  currentSection = sec;
  document.querySelectorAll('.section-tab').forEach(function(b){ b.classList.remove('active'); });
  document.getElementById('tab-'+sec).classList.add('active');
  renderCards();
}

/* ============================================================
   RENDER
============================================================ */
function renderCards() {
  var grid = document.getElementById('grid');
  grid.innerHTML = '';
  var term = searchTerm.toLowerCase();

  var filtered = questions.filter(function(q) {
    var secOk = currentSection==='all' ||
                (currentSection==='prog' && !q.isPattern) ||
                (currentSection==='pat'  && q.isPattern);
    var catOk = currentCat==='all' || q.cat===currentCat;
    var searchOk = String(q.title).toLowerCase().indexOf(term)>-1 ||
                   String(q.desc||'').toLowerCase().indexOf(term)>-1 ||
                   q.cat.toLowerCase().indexOf(term)>-1;
    return secOk && catOk && searchOk;
  });

  document.getElementById('visibleCount').textContent = filtered.length;

  if (!filtered.length) {
    grid.innerHTML = '<div class="no-results">&#9733; No missions found, Dark Knight &#9733;</div>';
    return;
  }

  for (var i=0; i<filtered.length; i++) {
    (function(q){
      var card = document.createElement('div');
      card.className = 'card' + (q.isPattern ? ' pattern-card' : '');
      var numStr = String(q.num);

      var innerHtml = '<div class="card-header">' +
        '<div class="q-num">' + numStr + '</div>' +
        '<div class="q-title">' + q.title + '</div></div>' +
        '<span class="q-cat">' + q.cat + '</span>' +
        '<p class="q-desc">' + (q.desc||'') + '</p>' +
        '<button class="expand-btn"><span class="btn-label">&#9656; View Code</span><span class="arrow">&#9660;</span></button>' +
        '<div class="expand-panel">';

      if (q.isPattern) {
        innerHtml += '<div class="section-label pat-label">Pattern Output (n=4)</div>' +
          '<div class="pattern-display">' + (q.pattern||'') + '</div>';
      } else {
        var exHtml = '';
        for (var e=0; e<(q.examples||[]).length; e++) {
          exHtml += '<div class="example-box"><span class="eg-num">Example '+(e+1)+'</span>'+
            q.examples[e].replace(/\n/g,'<br>')+'</div>';
        }
        innerHtml += '<div class="section-label eg-label">Examples</div><div class="examples-wrap">'+exHtml+'</div>';
      }

      innerHtml += '<div class="section-label code-label">Python Code (No Built-ins)</div>' +
        '<div class="code-box">'+(q.code||'')+'</div></div>';

      card.innerHTML = innerHtml;
      grid.appendChild(card);

      var btn   = card.querySelector('.expand-btn');
      var panel = card.querySelector('.expand-panel');
      var label = card.querySelector('.btn-label');
      var arrow = card.querySelector('.arrow');

      btn.addEventListener('click', function(){
        if (panel.classList.contains('open')) {
          panel.classList.remove('open');
          label.innerHTML = '&#9656; View Code';
          arrow.style.transform = 'rotate(0deg)';
        } else {
          panel.classList.add('open');
          label.innerHTML = '&#9662; Hide Code';
          arrow.style.transform = 'rotate(180deg)';
        }
      });
    })(filtered[i]);
  }
}

/* ============================================================
   EVENTS
============================================================ */
document.getElementById('filters').addEventListener('click', function(e){
  var btn = e.target.closest('.filter-btn');
  if (!btn) return;
  document.querySelectorAll('.filter-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  currentCat = btn.getAttribute('data-cat');
  renderCards();
});

document.getElementById('searchInput').addEventListener('input', function(e){
  searchTerm = e.target.value;
  renderCards();
});

window.addEventListener('scroll', function(){
  var doc = document.documentElement;
  var pct = (doc.scrollTop/(doc.scrollHeight-doc.clientHeight))*100;
  document.getElementById('progress').style.width = pct+'%';
});

renderCards();
</script>
