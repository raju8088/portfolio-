<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Programming Questions Explained</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F172A;
    --grad-start: #6366F1;
    --grad-end: #8B5CF6;
    --accent: #F59E0B;
    --text: #FFFFFF;
    --card-bg: rgba(99,102,241,0.07);
    --border: rgba(99,102,241,0.25);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(99,102,241,.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(99,102,241,.06) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
    z-index: 0;
  }
  .orb { position: fixed; border-radius: 50%; filter: blur(120px); opacity: 0.18; pointer-events: none; z-index: 0; }
  .orb-1 { width: 600px; height: 600px; background: var(--grad-start); top: -150px; left: -150px; }
  .orb-2 { width: 500px; height: 500px; background: var(--grad-end); bottom: -100px; right: -100px; }
  #progress { position: fixed; top: 0; left: 0; height: 3px; width: 0%; background: linear-gradient(90deg, var(--grad-start), var(--accent)); z-index: 999; transition: width 0.1s; }
  header { position: relative; z-index: 10; text-align: center; padding: 80px 24px 50px; }
  .badge { display: inline-block; background: linear-gradient(135deg, var(--grad-start), var(--grad-end)); color: #fff; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; padding: 6px 18px; border-radius: 999px; margin-bottom: 24px; }
  h1 { font-size: clamp(2.2rem, 6vw, 4.5rem); font-weight: 800; line-height: 1.05; letter-spacing: -2px; background: linear-gradient(135deg, #fff 30%, var(--grad-end)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .subtitle { margin-top: 14px; font-size: 1rem; color: rgba(255,255,255,0.45); }
  .search-wrap { position: relative; z-index: 10; max-width: 520px; margin: 32px auto 0; padding: 0 24px; }
  .search-wrap input { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; font-family: 'Space Mono', monospace; font-size: 13px; color: var(--text); outline: none; transition: border 0.3s; }
  .search-wrap input::placeholder { color: rgba(255,255,255,0.3); }
  .search-wrap input:focus { border-color: var(--grad-start); background: rgba(99,102,241,0.1); }
  .filters { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin: 28px 24px 0; position: relative; z-index: 10; }
  .filter-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: rgba(255,255,255,0.6); padding: 8px 20px; border-radius: 999px; font-family: 'Space Mono', monospace; font-size: 12px; cursor: pointer; transition: all 0.25s; }
  .filter-btn:hover, .filter-btn.active { background: linear-gradient(135deg, var(--grad-start), var(--grad-end)); border-color: transparent; color: #fff; box-shadow: 0 6px 20px rgba(99,102,241,0.35); }
  .stats { display: flex; justify-content: center; gap: 48px; flex-wrap: wrap; padding: 32px 24px 24px; position: relative; z-index: 10; }
  .stat { text-align: center; }
  .stat-num { font-size: 2rem; font-weight: 800; background: linear-gradient(135deg, var(--accent), #FCD34D); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .stat-label { font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 2px; color: rgba(255,255,255,0.35); text-transform: uppercase; margin-top: 4px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 22px; max-width: 1300px; margin: 0 auto; padding: 0 24px 80px; position: relative; z-index: 10; }
  .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 18px; padding: 26px; transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s; }
  .card:hover { transform: translateY(-5px); border-color: rgba(99,102,241,0.5); box-shadow: 0 16px 50px rgba(99,102,241,0.18); }
  .card-header { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 14px; }
  .q-num { min-width: 38px; height: 38px; background: linear-gradient(135deg, var(--grad-start), var(--grad-end)); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700; flex-shrink: 0; }
  .q-title { font-size: 1rem; font-weight: 700; line-height: 1.3; padding-top: 4px; }
  .q-cat { display: inline-block; font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent); border: 1px solid rgba(245,158,11,0.3); border-radius: 999px; padding: 3px 10px; margin-bottom: 10px; }
  .q-desc { font-size: 0.88rem; color: rgba(255,255,255,0.58); line-height: 1.7; margin-bottom: 16px; }
  .expand-btn { display: flex; align-items: center; justify-content: space-between; background: rgba(99,102,241,0.12); border: 1px solid rgba(99,102,241,0.35); color: rgba(255,255,255,0.8); font-family: 'Space Mono', monospace; font-size: 11px; padding: 10px 16px; border-radius: 10px; cursor: pointer; transition: all 0.25s; width: 100%; }
  .expand-btn:hover { background: rgba(99,102,241,0.28); border-color: var(--grad-start); color: #fff; }
  .expand-btn .arrow { transition: transform 0.3s; display: inline-block; }
  .expand-panel { display: none; margin-top: 14px; }
  .expand-panel.open { display: block; }
  .section-label { font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 6px; margin-top: 16px; }
  .section-label.eg-label { color: var(--accent); }
  .section-label.code-label { color: #6ee7b7; }
  .examples-wrap { display: flex; flex-direction: column; gap: 8px; }
  .example-box { background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.2); border-radius: 8px; padding: 10px 14px; font-family: 'Space Mono', monospace; font-size: 11.5px; color: #FCD34D; line-height: 1.7; }
  .example-box .eg-num { font-size: 9px; letter-spacing: 2px; color: rgba(245,158,11,0.5); display: block; margin-bottom: 3px; text-transform: uppercase; }
  .code-box { background: rgba(0,0,0,0.45); border: 1px solid rgba(99,102,241,0.2); border-radius: 10px; padding: 16px; font-family: 'Space Mono', monospace; font-size: 11.5px; line-height: 1.9; color: #a5f3fc; overflow-x: auto; white-space: pre; }
  .kw  { color: #c084fc; }
  .fn  { color: #6ee7b7; }
  .cm  { color: #6b7280; font-style: italic; }
  .num { color: #fbbf24; }
  .str { color: #86efac; }
  .no-results { text-align: center; padding: 80px 24px; color: rgba(255,255,255,0.3); font-size: 1rem; grid-column: 1/-1; }
  footer { position: relative; z-index: 10; text-align: center; padding: 28px; font-family: 'Space Mono', monospace; font-size: 11px; color: rgba(255,255,255,0.2); border-top: 1px solid var(--border); }
  @media (max-width: 768px) { .grid { grid-template-columns: 1fr; padding: 0 14px 60px; } h1 { letter-spacing: -1px; } }
</style>
</head>
<body>
<div id="progress"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<header>
  <div class="badge">&#128218; Python Programming</div>
  <h1>37 Questions<br>Explained</h1>
  <p class="subtitle">No built-in functions &bull; Manual logic &bull; 2-3 examples each</p>
</header>

<div class="search-wrap">
  <input type="text" id="searchInput" placeholder="&#128269;  Search questions..." />
</div>

<div class="filters" id="filters">
  <button class="filter-btn active" data-cat="all">All</button>
  <button class="filter-btn" data-cat="Numbers">Numbers</button>
  <button class="filter-btn" data-cat="Strings">Strings</button>
  <button class="filter-btn" data-cat="Lists">Lists</button>
  <button class="filter-btn" data-cat="Sorting">Sorting</button>
  <button class="filter-btn" data-cat="Series">Series</button>
  <button class="filter-btn" data-cat="OOP">OOP</button>
</div>

<div class="stats">
  <div class="stat"><div class="stat-num" id="visibleCount">37</div><div class="stat-label">Questions</div></div>
  <div class="stat"><div class="stat-num">6</div><div class="stat-label">Categories</div></div>
  <div class="stat"><div class="stat-num">&#8734;</div><div class="stat-label">Practice</div></div>
</div>

<div class="grid" id="grid"></div>
<footer>No built-in functions used &middot; Pure logic &middot; All 37 questions explained</footer>

<script>
var questions = [
  {
    num:1, cat:"Numbers", title:"Print 1 to N",
    desc:"Print all numbers from 1 to N using a loop. Use a counter variable that increments by 1 each iteration until it reaches N.",
    examples:[
      "Input: N=5\nOutput: 1 2 3 4 5",
      "Input: N=3\nOutput: 1 2 3",
      "Input: N=8\nOutput: 1 2 3 4 5 6 7 8"
    ],
    code:'n = 5\ni = 1\n<span class="kw">while</span> i <= n:\n    <span class="fn">print</span>(i, end=<span class="str">" "</span>)\n    i = i + <span class="num">1</span>\n<span class="cm"># No range() or built-in used</span>\n<span class="cm"># Output: 1 2 3 4 5</span>'
  },
  {
    num:2, cat:"Numbers", title:"Armstrong Number",
    desc:"A number is Armstrong if the sum of each digit raised to the power of the total number of digits equals the number. Count digits manually using division.",
    examples:[
      "Input: 153\n1^3 + 5^3 + 3^3 = 1+125+27 = 153  YES",
      "Input: 9474\n9^4+4^4+7^4+4^4 = 9474  YES",
      "Input: 100\n1^3+0^3+0^3 = 1 != 100  NO"
    ],
    code:'n = 153\ntemp = n\ncount = 0\n<span class="kw">while</span> temp != <span class="num">0</span>:\n    temp = temp // <span class="num">10</span>\n    count = count + <span class="num">1</span>\ntemp = n; total = <span class="num">0</span>\n<span class="kw">while</span> temp != <span class="num">0</span>:\n    d = temp % <span class="num">10</span>\n    power = <span class="num">1</span>\n    i = <span class="num">0</span>\n    <span class="kw">while</span> i < count:\n        power = power * d\n        i = i + <span class="num">1</span>\n    total = total + power\n    temp = temp // <span class="num">10</span>\n<span class="kw">if</span> total == n:\n    <span class="fn">print</span>(<span class="str">"Armstrong"</span>)\n<span class="kw">else</span>:\n    <span class="fn">print</span>(<span class="str">"Not Armstrong"</span>)'
  },
  {
    num:3, cat:"Series", title:"Fibonacci Check",
    desc:"Check if a number is in the Fibonacci sequence by generating Fibonacci numbers one by one until we reach or exceed the number.",
    examples:[
      "Input: 8\nSequence: 0,1,1,2,3,5,8  Found -> YES",
      "Input: 13\nSequence: 0,1,1,2,3,5,8,13  Found -> YES",
      "Input: 7\nSequence: 0,1,1,2,3,5,8  Not found -> NO"
    ],
    code:'n = 8\na = <span class="num">0</span>; b = <span class="num">1</span>\nfound = <span class="kw">False</span>\n<span class="kw">while</span> a <= n:\n    <span class="kw">if</span> a == n:\n        found = <span class="kw">True</span>\n        <span class="kw">break</span>\n    c = a + b\n    a = b\n    b = c\n<span class="kw">if</span> found:\n    <span class="fn">print</span>(<span class="str">"Fibonacci"</span>)\n<span class="kw">else</span>:\n    <span class="fn">print</span>(<span class="str">"Not Fibonacci"</span>)'
  },
  {
    num:4, cat:"Numbers", title:"Factorial",
    desc:"Factorial of N (N!) is the product of all integers from 1 to N. Multiply a result variable by each number from 1 to N using a loop.",
    examples:[
      "Input: 5\n5x4x3x2x1 = 120",
      "Input: 6\n6x5x4x3x2x1 = 720",
      "Input: 0\n0! = 1  (by definition)"
    ],
    code:'n = 5\nresult = <span class="num">1</span>\ni = <span class="num">1</span>\n<span class="kw">while</span> i <= n:\n    result = result * i\n    i = i + <span class="num">1</span>\n<span class="fn">print</span>(<span class="str">"Factorial:"</span>, result)\n<span class="cm"># Output: 120</span>'
  },
  {
    num:5, cat:"Numbers", title:"Strong Number",
    desc:"A Strong number equals the sum of factorials of its digits. Extract each digit using modulus, compute its factorial with a loop, then sum them.",
    examples:[
      "Input: 145\n1!+4!+5! = 1+24+120 = 145  YES",
      "Input: 40585\n4!+0!+5!+8!+5! = 40585  YES",
      "Input: 123\n1!+2!+3! = 1+2+6 = 9 != 123  NO"
    ],
    code:'n = 145\ntemp = n; total = <span class="num">0</span>\n<span class="kw">while</span> temp != <span class="num">0</span>:\n    d = temp % <span class="num">10</span>\n    fact = <span class="num">1</span>; k = <span class="num">1</span>\n    <span class="kw">while</span> k <= d:\n        fact = fact * k\n        k = k + <span class="num">1</span>\n    total = total + fact\n    temp = temp // <span class="num">10</span>\n<span class="kw">if</span> total == n:\n    <span class="fn">print</span>(<span class="str">"Strong Number"</span>)\n<span class="kw">else</span>:\n    <span class="fn">print</span>(<span class="str">"Not Strong"</span>)'
  },
  {
    num:6, cat:"Numbers", title:"Perfect Number",
    desc:"A Perfect number equals the sum of all its divisors excluding itself. Check each number from 1 to n-1 manually to see if it divides evenly.",
    examples:[
      "Input: 6\nDivisors: 1,2,3  -> 1+2+3=6  YES",
      "Input: 28\n1+2+4+7+14 = 28  YES",
      "Input: 12\n1+2+3+4+6 = 16 != 12  NO"
    ],
    code:'n = 6\ni = <span class="num">1</span>; total = <span class="num">0</span>\n<span class="kw">while</span> i < n:\n    <span class="kw">if</span> n % i == <span class="num">0</span>:\n        total = total + i\n    i = i + <span class="num">1</span>\n<span class="kw">if</span> total == n:\n    <span class="fn">print</span>(<span class="str">"Perfect Number"</span>)\n<span class="kw">else</span>:\n    <span class="fn">print</span>(<span class="str">"Not Perfect"</span>)'
  },
  {
    num:7, cat:"Numbers", title:"Reverse Positive Divisors",
    desc:"Find all divisors of a number (excluding itself), store them in a list, then print the list in reverse order using index traversal.",
    examples:[
      "Input: 12\nDivisors: [1,2,3,4,6]  Reversed: [6,4,3,2,1]",
      "Input: 10\nDivisors: [1,2,5]  Reversed: [5,2,1]",
      "Input: 16\nDivisors: [1,2,4,8]  Reversed: [8,4,2,1]"
    ],
    code:'n = 12\ndivs = []\ni = <span class="num">1</span>\n<span class="kw">while</span> i < n:\n    <span class="kw">if</span> n % i == <span class="num">0</span>:\n        divs.append(i)\n    i = i + <span class="num">1</span>\n<span class="cm"># Print in reverse using index</span>\nj = <span class="fn">len</span>(divs) - <span class="num">1</span>\n<span class="kw">while</span> j >= <span class="num">0</span>:\n    <span class="fn">print</span>(divs[j], end=<span class="str">" "</span>)\n    j = j - <span class="num">1</span>\n<span class="cm"># Output: 6 4 3 2 1</span>'
  },
  {
    num:8, cat:"Numbers", title:"Digit Frequency",
    desc:"Count how many times each digit appears in a number. Extract digits using modulus one by one and use a list of size 10 as a frequency counter.",
    examples:[
      "Input: 11223\n1->2  2->2  3->1",
      "Input: 99821\n9->2  8->1  2->1  1->1",
      "Input: 40040\n4->2  0->3"
    ],
    code:'n = 11223\nfreq = [<span class="num">0</span>] * <span class="num">10</span>\ntemp = n\n<span class="kw">while</span> temp != <span class="num">0</span>:\n    d = temp % <span class="num">10</span>\n    freq[d] = freq[d] + <span class="num">1</span>\n    temp = temp // <span class="num">10</span>\ni = <span class="num">0</span>\n<span class="kw">while</span> i < <span class="num">10</span>:\n    <span class="kw">if</span> freq[i] > <span class="num">0</span>:\n        <span class="fn">print</span>(i, <span class="str">"->"</span>, freq[i])\n    i = i + <span class="num">1</span>'
  },
  {
    num:9, cat:"Lists", title:"Missing Numbers in List",
    desc:"Find missing numbers between min and max of a list. For each number in the expected range, manually check if it exists in the given list.",
    examples:[
      "Input: [1,2,4,6]\nMissing: 3, 5",
      "Input: [1,3,5,7]\nMissing: 2, 4, 6",
      "Input: [2,3,6,9]\nMissing: 4, 5, 7, 8"
    ],
    code:'lst = [<span class="num">1</span>,<span class="num">2</span>,<span class="num">4</span>,<span class="num">6</span>]\n<span class="cm"># Find min manually</span>\nlo = lst[<span class="num">0</span>]; hi = lst[<span class="num">0</span>]\ni = <span class="num">0</span>\n<span class="kw">while</span> i < <span class="fn">len</span>(lst):\n    <span class="kw">if</span> lst[i] < lo: lo = lst[i]\n    <span class="kw">if</span> lst[i] > hi: hi = lst[i]\n    i = i + <span class="num">1</span>\n<span class="cm"># Check each number in range</span>\nnum = lo\n<span class="kw">while</span> num <= hi:\n    found = <span class="kw">False</span>\n    j = <span class="num">0</span>\n    <span class="kw">while</span> j < <span class="fn">len</span>(lst):\n        <span class="kw">if</span> lst[j] == num:\n            found = <span class="kw">True</span>\n            <span class="kw">break</span>\n        j = j + <span class="num">1</span>\n    <span class="kw">if not</span> found:\n        <span class="fn">print</span>(num, end=<span class="str">" "</span>)\n    num = num + <span class="num">1</span>'
  },
  {
    num:10, cat:"Numbers", title:"Palindrome Number",
    desc:"Reverse a number by extracting digits using modulus and rebuilding. If the reversed number equals the original, it is a palindrome.",
    examples:[
      "Input: 121\nReversed: 121  Equal -> YES",
      "Input: 1331\nReversed: 1331  Equal -> YES",
      "Input: 123\nReversed: 321  Not equal -> NO"
    ],
    code:'n = 121\ntemp = n; rev = <span class="num">0</span>\n<span class="kw">while</span> temp != <span class="num">0</span>:\n    d = temp % <span class="num">10</span>\n    rev = rev * <span class="num">10</span> + d\n    temp = temp // <span class="num">10</span>\n<span class="kw">if</span> rev == n:\n    <span class="fn">print</span>(<span class="str">"Palindrome"</span>)\n<span class="kw">else</span>:\n    <span class="fn">print</span>(<span class="str">"Not Palindrome"</span>)'
  },
  {
    num:11, cat:"Numbers", title:"Armstrong (Reusable Function)",
    desc:"Same logic as Q2 written as a reusable function. Count digits first, then compute digit powers manually and compare sum to original number.",
    examples:[
      "Input: 153  -> Armstrong YES",
      "Input: 370  -> 3^3+7^3+0^3=27+343+0=370  YES",
      "Input: 200  -> 2^3+0+0=8 != 200  NO"
    ],
    code:'<span class="kw">def</span> <span class="fn">is_armstrong</span>(n):\n    temp = n; count = <span class="num">0</span>\n    <span class="kw">while</span> temp != <span class="num">0</span>:\n        temp = temp // <span class="num">10</span>\n        count = count + <span class="num">1</span>\n    temp = n; total = <span class="num">0</span>\n    <span class="kw">while</span> temp != <span class="num">0</span>:\n        d = temp % <span class="num">10</span>\n        p = <span class="num">1</span>; k = <span class="num">0</span>\n        <span class="kw">while</span> k < count:\n            p = p * d; k+=<span class="num">1</span>\n        total = total + p\n        temp = temp // <span class="num">10</span>\n    <span class="kw">return</span> total == n\n\n<span class="fn">print</span>(<span class="fn">is_armstrong</span>(<span class="num">153</span>))  <span class="cm"># True</span>\n<span class="fn">print</span>(<span class="fn">is_armstrong</span>(<span class="num">370</span>))  <span class="cm"># True</span>'
  },
  {
    num:12, cat:"Numbers", title:"Even or Odd",
    desc:"Use the modulus operator to check if dividing by 2 gives remainder 0 (even) or remainder 1 (odd). No built-in needed.",
    examples:[
      "Input: 7\n7 % 2 = 1  -> Odd",
      "Input: 4\n4 % 2 = 0  -> Even",
      "Input: 100\n100 % 2 = 0  -> Even"
    ],
    code:'n = 7\n<span class="kw">if</span> n % <span class="num">2</span> == <span class="num">0</span>:\n    <span class="fn">print</span>(<span class="str">"Even"</span>)\n<span class="kw">else</span>:\n    <span class="fn">print</span>(<span class="str">"Odd"</span>)\n\n<span class="cm"># Test with 4</span>\nn = <span class="num">4</span>\n<span class="kw">if</span> n % <span class="num">2</span> == <span class="num">0</span>:\n    <span class="fn">print</span>(<span class="str">"Even"</span>)  <span class="cm"># Even</span>'
  },
  {
    num:13, cat:"Numbers", title:"Max and Min",
    desc:"Scan the list once, keeping track of the largest and smallest values seen so far by comparing each element manually.",
    examples:[
      "Input: [3,1,9,2,7]\nMax: 9  Min: 1",
      "Input: [15,3,22,8]\nMax: 22  Min: 3",

var currentCat = 'all';
var searchTerm = '';

function renderCards() {
  var grid = document.getElementById('grid');
  grid.innerHTML = '';

  var filtered = questions.filter(function(q) {
    var catOk = currentCat === 'all' || q.cat === currentCat;
    var term = searchTerm.toLowerCase();
    var searchOk = q.title.toLowerCase().indexOf(term) > -1 ||
                   q.desc.toLowerCase().indexOf(term) > -1 ||
                   q.cat.toLowerCase().indexOf(term) > -1;
    return catOk && searchOk;
  });

  document.getElementById('visibleCount').textContent = filtered.length;

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="no-results">No questions found</div>';
    return;
  }

  for (var i = 0; i < filtered.length; i++) {
    (function(q) {
      var card = document.createElement('div');
      card.className = 'card';
      var numStr = q.num < 10 ? '0' + q.num : '' + q.num;

      var exHtml = '';
      for (var e = 0; e < q.examples.length; e++) {
        exHtml += '<div class="example-box"><span class="eg-num">Example ' + (e+1) + '</span>' +
                  q.examples[e].replace(/\n/g, '<br>') + '</div>';
      }

      card.innerHTML =
        '<div class="card-header">' +
          '<div class="q-num">' + numStr + '</div>' +
          '<div class="q-title">' + q.title + '</div>' +
        '</div>' +
        '<span class="q-cat">' + q.cat + '</span>' +
        '<p class="q-desc">' + q.desc + '</p>' +
        '<button class="expand-btn">' +
          '<span class="btn-label">&#9654; View Examples &amp; Code</span>' +
          '<span class="arrow">&#9660;</span>' +
        '</button>' +
        '<div class="expand-panel">' +
          '<div class="section-label eg-label">Examples</div>' +
          '<div class="examples-wrap">' + exHtml + '</div>' +
          '<div class="section-label code-label">Python Code (No Built-ins)</div>' +
          '<div class="code-box">' + q.code + '</div>' +
        '</div>';

      grid.appendChild(card);

      var btn   = card.querySelector('.expand-btn');
      var panel = card.querySelector('.expand-panel');
      var label = card.querySelector('.btn-label');
      var arrow = card.querySelector('.arrow');

      btn.addEventListener('click', function() {
        if (panel.classList.contains('open')) {
          panel.classList.remove('open');
          label.innerHTML = '&#9654; View Examples &amp; Code';
          arrow.style.transform = 'rotate(0deg)';
        } else {
          panel.classList.add('open');
          label.innerHTML = '&#9660; Hide Examples &amp; Code';
          arrow.style.transform = 'rotate(180deg)';
        }
      });
    })(filtered[i]);
  }
}

document.getElementById('filters').addEventListener('click', function(e) {
  var btn = e.target.closest('.filter-btn');
  if (!btn) return;
  document.querySelectorAll('.filter-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  currentCat = btn.getAttribute('data-cat');
  renderCards();
});

document.getElementById('searchInput').addEventListener('input', function(e) {
  searchTerm = e.target.value;
  renderCards();
});

window.addEventListener('scroll', function() {
  var doc = document.documentElement;
  var pct = (doc.scrollTop / (doc.scrollHeight - doc.clientHeight)) * 100;
  document.getElementById('progress').style.width = pct + '%';
});

renderCards();
</script>
